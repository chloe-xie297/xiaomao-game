<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef2dc">
<title>小白菜的 UIUC 地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: a scrollable illustrated campus map fills the screen; a sticker toolbar floats at the bottom; place details slide up as a sheet */
:root{
  --ink:#2d2346;
  --card:#fffdf8;
  --tigger:#f39c3d;
  --piglet:#f4a6bd;
  --piglet-deep:#d9708f;
  --lawn:#a9d58b;
  --ground:#eef2dc;
  --muted:#6f6488;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --round:"ZCOOL QingKe HuangYou","ZCOOL KuaiLe","Yuanti SC","YouYuan",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3a78b5;outline-offset:2px}

header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.pill{pointer-events:auto;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:4px 14px;font-family:var(--display);white-space:nowrap}
header h1{margin:0;font-weight:400;font-size:19px;line-height:1.3}
header h1 .b{color:var(--piglet-deep)} header h1 .c{color:#d97b25}
header .note{font-size:12.5px;color:var(--muted);font-family:var(--body);box-shadow:none;border-width:1.5px;padding:2px 10px}

#mapWrap{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#map{display:block;width:100%;min-width:760px;height:auto;padding-top:calc(54px + env(safe-area-inset-top,0px));padding-bottom:62vh}
#map text{font-family:var(--display);user-select:none;-webkit-user-select:none}
.street-name{font-size:19px;fill:#8c8170;letter-spacing:1px}
.area-name{font-size:22px;fill:#4d6b3c}
.pin{cursor:pointer}
.pin .halo{fill:var(--tigger);opacity:0;transition:opacity .2s}
.pin:focus-visible .badge{stroke:#3a78b5;stroke-width:5}
.mark{cursor:pointer}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.placing #map{cursor:crosshair}

/* bottom toolbar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;align-items:flex-end;justify-content:space-between;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bar .grp{display:flex;gap:8px;align-items:center;pointer-events:auto;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:18px;background:var(--tigger);border:3px solid var(--ink);border-radius:14px;padding:7px 16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.btn.pink{background:var(--piglet)}
.btn.sm{font-size:15px;padding:5px 12px;border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
.btn.on{background:var(--ink);color:var(--card)}
.zoom{display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:42px;padding:2px 0;font-size:22px;text-align:center}

#hint{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--card);
  font-family:var(--display);padding:6px 16px;border-radius:999px;white-space:nowrap;pointer-events:none;font-size:15px}

/* place sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
#sheet .panel{pointer-events:auto;width:100%;max-width:620px;max-height:60vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);
  border:3px solid var(--ink);border-bottom:none;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(45,35,70,.22);
  padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.grab{width:46px;height:5px;border-radius:9px;background:#d6cfe0;align-self:center}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head .t{flex:1;min-width:0}
.eyebrow{font-family:var(--display);font-size:14px;letter-spacing:1.5px;color:#d97b25}
.sheet-head h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.2;text-wrap:balance}
.en{font-size:13px;color:var(--muted)}
.close{background:var(--card);border:2.5px solid var(--ink);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.say{display:flex;gap:10px;align-items:center}
.say svg{flex:none;width:54px;height:60px}
.say .bub{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px 14px;font-family:var(--round);font-size:18px;line-height:1.45;letter-spacing:.5px}
.say .bub::before{content:"";position:absolute;left:-10px;top:50%;width:14px;height:14px;background:#fff;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.info{margin:0;max-width:40em}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.facts li{font-size:13px;background:#f3eee2;border-radius:999px;padding:2px 10px}
.photos h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#eee;padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.add{aspect-ratio:1;border:2.5px dashed var(--ink);border-radius:10px;display:grid;place-items:center;text-align:center;background:#fffaf2;cursor:pointer;font-family:var(--display);font-size:15px;line-height:1.3;color:var(--ink)}
.add input{position:absolute;width:1px;height:1px;opacity:0}
.small{font-size:12.5px;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--display);font-size:15px}
.field input,.field textarea{font:16px var(--body);border:2.5px solid var(--ink);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
.field textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* photo viewer */
#viewer{position:fixed;inset:0;z-index:20;background:rgba(30,22,48,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#viewer .pol{background:#fff;padding:10px 10px 34px;transform:rotate(-1.5deg);box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:100%;position:relative}
#viewer img{display:block;max-width:min(88vw,720px);max-height:68vh;width:auto;height:auto}
#viewer .cap{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-family:var(--round);color:var(--muted)}

@media (prefers-reduced-motion:reduce){ #sheet .panel{animation:none} }
@media (max-width:420px){ header h1{font-size:17px} .btn{font-size:16px;padding:6px 12px} }
</style>
</head>
<body>

<header>
  <h1 class="pill"><span class="b">小白菜</span>带<span class="c">小李一加</span>逛 UIUC</h1>
  <span class="pill note">示意图 · 不按比例</span>
</header>

<div id="mapWrap"><svg id="map" viewBox="0 0 1000 1000" role="img" aria-label="UIUC 校园示意地图"></svg></div>

<div id="hint" hidden>点一下地图，放一个新标记</div>

<div id="bar">
  <div class="grp">
    <button class="btn ghost sm" id="markBtn">＋ 标记地点</button>
  </div>
  <div class="grp zoom">
    <button class="btn ghost" id="zin" aria-label="放大">＋</button>
    <button class="btn ghost" id="zout" aria-label="缩小">－</button>
  </div>
</div>

<div id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="false"></div></div>

<div id="viewer" hidden>
  <div class="pol"><img id="vImg" alt=""><div class="cap" id="vCap"></div></div>
  <div class="row"><button class="btn ghost sm" id="vClose">关闭</button><button class="btn ghost sm" id="vDel">删除这张</button></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const INK='#2d2346';

/* ---------- places ---------- */
const PLACES=[
  {id:'busey',name:'Busey Hall',en:'Busey-Evans Residence Halls',x:790,y:806,
   say:'这里是 Busey Hall！红砖老楼是不是很好看？',
   info:'Busey-Evans 宿舍由 Busey Hall 和 Evans Hall 两栋红砖楼组成，是校园里历史比较久的宿舍楼，在 Main Quad 的东南边，靠近 Nevada St。',
   facts:['宿舍','红砖老楼','Nevada St 附近']},
  {id:'isr',name:'ISR',en:'Illinois Street Residence Halls',x:846,y:520,
   say:'这是 ISR！饿了可以直接去楼下食堂吃饭。',
   info:'ISR 是 Illinois Street Residence Halls 的简称，由 Townsend Hall 和 Wardall Hall 两栋楼组成，楼里有 ISR 食堂。走几分钟就能到工程学院和 Main Quad。',
   facts:['宿舍','Townsend + Wardall','有食堂']},
  {id:'quad',name:'Main Quad',en:'Main Quadrangle',x:494,y:660,
   say:'这就是 Main Quad！天气好的时候大家都躺在草坪上。',
   info:'校园的中心大草坪。北头是 Illini Union，南头是带圆顶的 Foellinger Auditorium。西北角 Wright St 和 Green St 路口有 Alma Mater 雕像，旁边是有钟楼的 Altgeld Hall。',
   facts:['Illini Union','Foellinger Auditorium','Alma Mater 雕像']},
  {id:'eng',name:'工程学院',en:'Engineering Campus',x:626,y:262,
   say:'这是工程学院，Grainger 图书馆是学习圣地！',
   info:'Green St 北边就是工程学院。中间的草坪叫 Bardeen Quad，北头是 Grainger 工程图书馆，计算机系的 Siebel Center 也在这一片。Boneyard Creek 小溪从这里穿过。',
   facts:['Bardeen Quad','Grainger Library','Siebel Center']},
  {id:'green',name:'绿街',en:'Green Street · Campustown',x:214,y:420,
   say:'来绿街吃好吃的！奶茶、火锅都在这条街上。',
   info:'Green Street 是 Campustown 的主街，从 Wright St 往西一路都是餐厅、奶茶店、咖啡店和小超市，晚上和周末最热闹。',
   facts:['Campustown','吃饭','奶茶']},
  {id:'crce',name:'CRCE 健身房',en:'Campus Recreation Center East',x:892,y:906,
   say:'一起来 CRCE 撸铁！练完再去吃好吃的。',
   info:'CRCE 是 Campus Recreation Center East 的简称，学校的健身房之一，在 Busey-Evans 南边、Gregory Dr 旁边。里面有器械区、球场和游泳池，刷 i-card 进门。',
   facts:['健身房','刷 i-card','Gregory Dr 旁边']},
  {id:'books',name:'Bookstore',en:'Illini Union Bookstore',x:318,y:660,
   say:'来书店买一件 Illinois 卫衣，我们穿闺蜜款！',
   info:'Illini Union Bookstore 在 Wright St 和 Daniel St 路口，卖教材和文具，还有很多 Illinois 周边：卫衣、帽子、杯子和纪念品。',
   facts:['教材','文具','Illinois 周边']}
];

/* ---------- storage ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let marks=LS.get('uiuc-marks',[]);
let dbp=null;
function db(){ if(dbp)return dbp; dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open('uiuc-photos',1); r.onupgradeneeded=()=>{const s=r.result.createObjectStore('photos',{keyPath:'id'}); s.createIndex('place','place');}; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); return dbp; }
const memPhotos=[];
async function photosFor(place){
  try{ const d=await db(); return await new Promise((res,rej)=>{ const q=d.transaction('photos').objectStore('photos').index('place').getAll(place); q.onsuccess=()=>res(q.result.sort((a,b)=>a.ts-b.ts)); q.onerror=()=>rej(q.error); }); }
  catch(e){ return memPhotos.filter(p=>p.place===place); }
}
async function putPhoto(p){ try{ const d=await db(); await new Promise((res,rej)=>{const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').put(p); tx.oncomplete=res; tx.onerror=()=>rej(tx.error);}); }catch(e){ memPhotos.push(p); } }
async function delPhoto(id){ try{ const d=await db(); await new Promise((res,rej)=>{const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error);}); }catch(e){ const i=memPhotos.findIndex(p=>p.id===id); if(i>=0)memPhotos.splice(i,1); } }
function shrink(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const m=1400, k=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error('压缩失败')),'image/jpeg',.84); };
  im.onerror=()=>{URL.revokeObjectURL(url); rej(new Error('这张图片打不开，换一张试试'));}; im.src=url; }); }

/* ---------- map drawing ---------- */
const svg=$('map');
const el=(tag,attrs,parent=svg)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs)e.setAttribute(k,attrs[k]); parent.appendChild(e); return e; };
const txt=(x,y,s,cls,parent=svg,extra={})=>{ const t=el('text',Object.assign({x,y,class:cls},extra),parent); t.textContent=s; return t; };
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};

function drawMap(){
  svg.innerHTML='';
  el('rect',{x:0,y:0,width:1000,height:1000,fill:'#eef2dc'});
  // lawns and blocks
  const lawn=(x,y,w,h,r=14)=>el('rect',{x,y,width:w,height:h,rx:r,fill:'#b9dd98',stroke:'#8fbf6e','stroke-width':2});
  lawn(398,440,190,440); lawn(470,150,260,230); lawn(20,40,350,350,18); lawn(20,450,350,520,18); lawn(620,440,120,520); lawn(780,610,200,150); lawn(890,40,90,370);
  // Boneyard Creek through engineering
  el('path',{d:'M380,330 C450,300 470,360 540,350 S650,300 720,330 S830,380 900,350',fill:'none',stroke:'#7cc0e8','stroke-width':9,'stroke-linecap':'round'});
  txt(800,392,'Boneyard Creek','street-name',svg,{style:'font-size:15px;fill:#4a8cc0'});
  // streets: outline then fill
  const H=[[180,'Springfield Ave'],[420,'Green St'],[520,'Illinois St'],[940,'Gregory Dr']], V=[[380,'Wright St'],[600,'Mathews Ave'],[760,'Goodwin Ave'],[940,'Lincoln Ave']];
  const nev=[740,'Nevada St'];
  for(const pass of [0,1]){
    const st=pass?{stroke:'#fffaf0','stroke-width':24}:{stroke:'#cfc6b3','stroke-width':30};
    for(const [y] of H) el('line',Object.assign({x1:0,y1:y,x2:1000,y2:y,'stroke-linecap':'butt'},st));
    el('line',Object.assign({x1:600,y1:nev[0],x2:1000,y2:nev[0]},st));
    for(const [x] of V) el('line',Object.assign({x1:x,y1:0,x2:x,y2:1000},st));
  }
  el('line',{x1:0,y1:420,x2:380,y2:420,stroke:'#f7d9a0','stroke-width':24});
  for(const [y,n] of H) txt(y===420?60:40,y+7,n,'street-name');
  txt(800,nev[0]+7,nev[1],'street-name');
  for(const [x,n] of V){ const t=txt(x+7,x===380?300:x===940?260:100,n,'street-name'); t.setAttribute('transform',`rotate(90 ${x+7} ${x===380?300:x===940?260:100})`); t.setAttribute('x',x+7); }
  // generic buildings
  const bld=(x,y,w,h,fill='#c97a5f',label)=>{ el('rect',{x,y,width:w,height:h,rx:4,fill,stroke:INK,'stroke-width':2.5}); if(label){ txt(x+w/2,y+h/2+6,label,'area-name',svg,{'text-anchor':'middle',style:'font-size:15px;fill:#fff'}); } };
  // Campustown shops on Green St
  const shopC=['#f4a6bd','#f6c453','#8ec5e8','#f39c3d','#b5a7e0','#9fd39a'];
  for(let i=0;i<9;i++){ const x=30+i*38; bld(x,384,30,22,shopC[i%6]); el('path',{d:`M${x},${384} h30 l-3,7 h-24z`,fill:'#fff',opacity:.7}); bld(x,436,30,22,shopC[(i+3)%6]); }
  txt(200,372,'Campustown','area-name',svg,{'text-anchor':'middle'});
  // Main Quad
  el('path',{d:'M402,444 L584,876 M584,444 L402,876 M493,444 V876',stroke:'#e9dfc3','stroke-width':7,fill:'none'});
  bld(440,438,110,32,'#c97a5f','Illini Union');
  bld(395,450,40,46,'#b8694f'); el('rect',{x:405,y:432,width:14,height:20,fill:'#b8694f',stroke:INK,'stroke-width':2}); el('path',{d:'M403,432 l9,-12 l9,12z',fill:'#6b7f8a',stroke:INK,'stroke-width':2});
  txt(396,512,'Altgeld','street-name',svg,{style:'font-size:14px;fill:#7a5a4a'});
  // Alma Mater
  el('circle',{cx:368,cy:448,r:13,fill:'#5f8a72',stroke:INK,'stroke-width':2}); el('path',{d:'M361,449 l7,-8 l7,8',fill:'none',stroke:'#fff','stroke-width':2});
  txt(306,476,'Alma Mater','street-name',svg,{style:'font-size:14px;fill:#3f6b55'});
  for(let i=0;i<5;i++){ bld(404,540+i*62,26,44,'#c98a63'); bld(560,540+i*62,26,44,'#c98a63'); }
  bld(450,862,90,40,'#c98a63'); el('path',{d:'M462,862 a33,30 0 0 1 66,0',fill:'#8fa7a0',stroke:INK,'stroke-width':2.5});
  txt(495,930,'Foellinger','street-name',svg,{'text-anchor':'middle',style:'font-size:14px;fill:#7a5a4a'});
  txt(494,600,'Main Quad','area-name',svg,{'text-anchor':'middle'});
  // Engineering
  bld(520,66,180,56,'#d9b07a','Grainger Library'); bld(410,206,50,110,'#c97a5f'); bld(745,200,70,80,'#c97a5f'); bld(800,40,80,110,'#9fb6c6','Siebel'); bld(420,40,80,80,'#c98a63');
  txt(600,258,'Bardeen Quad','area-name',svg,{'text-anchor':'middle',style:'font-size:18px'});
  // ISR
  bld(790,470,50,34,'#c97a5f'); bld(850,470,52,34,'#c97a5f'); bld(790,540,112,40,'#d9b07a','食堂');
  txt(846,462,'Townsend · Wardall','street-name',svg,{'text-anchor':'middle',style:'font-size:13px;fill:#7a5a4a'});
  // Busey-Evans
  bld(770,770,60,70,'#b8694f'); bld(840,770,70,70,'#b8694f');
  // CRCE gym, north side of Gregory Dr
  bld(772,862,148,56,'#8fa3b8'); el('rect',{x:784,y:872,width:124,height:12,rx:3,fill:'#cfe3ef',stroke:INK,'stroke-width':1.5});
  // Illini Union Bookstore at Wright & Daniel
  el('line',{x1:0,y1:600,x2:380,y2:600,stroke:'#cfc6b3','stroke-width':22}); el('line',{x1:0,y1:600,x2:380,y2:600,stroke:'#fffaf0','stroke-width':16});
  txt(60,606,'Daniel St','street-name',svg,{style:'font-size:16px'});
  bld(272,614,92,58,'#e07a3a'); el('rect',{x:272,y:614,width:92,height:12,fill:'#13294b',stroke:INK,'stroke-width':2});
  el('path',{d:'M312,617 h12 v2 h-3 v6 h3 v2 h-12 v-2 h3 v-6 h-3z',fill:'#e07a3a'});
  // trees
  for(let i=0;i<70;i++){ const x=30+rnd(i)*940, y=30+rnd(i+50)*940; if(nearRoad(x,y)||inBuilding(x,y))continue; el('circle',{cx:x,cy:y,r:9+rnd(i+9)*6,fill:i%5===0?'#f0a24a':'#6fae5c',stroke:INK,'stroke-width':1.5,opacity:.95}); }
  // compass
  const cp=el('g',{transform:'translate(940,90)'}); el('circle',{cx:0,cy:0,r:26,fill:'#fff',stroke:INK,'stroke-width':2.5},cp); el('path',{d:'M0,-20 L8,6 L0,0 L-8,6Z',fill:'#e4473f',stroke:INK,'stroke-width':1.5},cp); txt(0,20,'N','street-name',cp,{'text-anchor':'middle',style:'font-size:14px;fill:#2d2346'});
  // pins
  pinsG=el('g',{});
  marksG=el('g',{});
  charsG=el('g',{});
  bunny=charG('bunny'); cat=charG('cat');
  renderPins(); renderMarks(); placeChars();
}
function nearRoad(x,y){ for(const v of [180,420,520,940])if(Math.abs(y-v)<28)return true; for(const v of [380,600,760,940])if(Math.abs(x-v)<28)return true; if(x>600&&Math.abs(y-740)<28)return true; return false; }
function inBuilding(x,y){ const boxes=[[20,370,360,100],[390,420,210,480],[400,30,500,120],[400,190,440,140],[770,450,150,150],[760,760,170,120],[280,430,110,60],[900,50,80,80],[260,590,120,100],[760,850,170,80],[140,760,160,60]]; return boxes.some(([bx,by,w,h])=>x>bx-12&&x<bx+w+12&&y>by-12&&y<by+h+12); }

let pinsG,marksG,charsG,bunny,cat;
function renderPins(){
  pinsG.innerHTML='';
  PLACES.forEach((p,i)=>{
    const g=el('g',{class:'pin',transform:`translate(${p.x},${p.y})`,tabindex:0,role:'button','aria-label':p.name},pinsG);
    el('circle',{class:'halo',r:34},g);
    el('path',{d:'M0,0 C-14,-20 -24,-30 -24,-46 A24,24 0 1 1 24,-46 C24,-30 14,-20 0,0Z',class:'badge',fill:'#fffdf8',stroke:INK,'stroke-width':3},g);
    el('circle',{cx:0,cy:-46,r:9,fill:'#f4a6bd',stroke:INK,'stroke-width':2.5},g);
    const lab=el('g',{transform:'translate(0,22)'},g);
    const w=[...p.name].reduce((a,c)=>a+(c.charCodeAt(0)>255?19:11),0)+26;
    el('rect',{x:-w/2,y:-4,width:w,height:30,rx:15,fill:'#2d2346'},lab);
    txt(0,18,p.name,'',lab,{'text-anchor':'middle',style:'font-size:18px;fill:#fffdf8'});
    const open=()=>{ openPlace(p.id); scrollToPt(p.x,p.y,.22); }; g.addEventListener('click',e=>{e.stopPropagation(); if(!placing)open();}); g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  });
}
function renderMarks(){
  marksG.innerHTML='';
  marks.forEach(m=>{
    const g=el('g',{class:'mark',transform:`translate(${m.x},${m.y})`,tabindex:0,role:'button','aria-label':m.name},marksG);
    const star='M0,-22 L6.5,-8 L22,-7 L10,4 L13.5,19 L0,11 L-13.5,19 L-10,4 L-22,-7 L-6.5,-8Z';
    el('path',{d:star,fill:'#f6c453',stroke:INK,'stroke-width':2.5,'stroke-linejoin':'round'},g);
    const w=Math.min(14,m.name.length)*17+20;
    el('rect',{x:-w/2,y:24,width:w,height:26,rx:13,fill:'#fffdf8',stroke:INK,'stroke-width':2},g);
    txt(0,43,m.name.length>14?m.name.slice(0,13)+'…':m.name,'',g,{'text-anchor':'middle',style:'font-size:15px;fill:#2d2346'});
    g.addEventListener('click',e=>{e.stopPropagation(); if(!placing)openMark(m.id);});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();openMark(m.id);}});
  });
}

/* ---------- characters (same doodle style as the game) ---------- */
function charG(kind){
  const g=el('g',{},charsG), inner=el('g',{},g);
  if(kind==='bunny'){
    inner.innerHTML=`<ellipse cx="-7" cy="-2" rx="6" ry="3.6" fill="#fff" stroke="${INK}" stroke-width="2"/><ellipse cx="7" cy="-2" rx="6" ry="3.6" fill="#fff" stroke="${INK}" stroke-width="2"/>
    <ellipse cx="-6" cy="-41" rx="6" ry="13" transform="rotate(-9 -6 -41)" fill="#fff" stroke="${INK}" stroke-width="2.2"/><ellipse cx="7" cy="-41" rx="6" ry="13" transform="rotate(10 7 -41)" fill="#fff" stroke="${INK}" stroke-width="2.2"/>
    <ellipse cx="0" cy="-17" rx="18" ry="17" fill="#fff" stroke="${INK}" stroke-width="2.4"/>
    <path transform="translate(-5,-26)" d="M0,-5 L1.5,-1.6 5,-1.6 2.2,.8 3.2,4.4 0,2.2 -3.2,4.4 -2.2,.8 -5,-1.6 -1.5,-1.6Z" fill="none" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="3" cy="-16" r="2" fill="${INK}"/><circle cx="11" cy="-16" r="2" fill="${INK}"/>
    <circle cx="-1" cy="-11" r="2.4" fill="#f4a6bd" opacity=".7"/><circle cx="15" cy="-11" r="2.4" fill="#f4a6bd" opacity=".7"/>
    <path d="M-4,-4 L16,-8 L10,5Z" fill="#f4a6bd" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`;
  } else {
    inner.innerHTML=`<path d="M-14,-9 Q-26,-10 -24,-22" fill="none" stroke="${INK}" stroke-width="6.5" stroke-linecap="round"/><path d="M-14,-9 Q-26,-10 -24,-22" fill="none" stroke="#c9c6d4" stroke-width="3.6" stroke-linecap="round"/>
    <ellipse cx="-7" cy="-2" rx="5" ry="3.2" fill="#fff" stroke="${INK}" stroke-width="1.8"/><ellipse cx="7" cy="-2" rx="5" ry="3.2" fill="#fff" stroke="${INK}" stroke-width="1.8"/>
    <path d="M-13,-20 L-12,-35 L-2,-27Z M4,-28 L13,-35 L15,-21Z" fill="#fff" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-14" rx="16.5" ry="14.5" fill="#fff" stroke="${INK}" stroke-width="2.3"/>
    <path d="M-6,-28 C6,-29 14,-24 16,-15 C9,-20 2,-22 -6,-28Z" fill="#c9c6d4"/>
    <circle cx="2.8" cy="-13.5" r="1.9" fill="${INK}"/><circle cx="10.8" cy="-13.5" r="1.9" fill="${INK}"/>
    <path d="M16,-12 H24 M16,-9.5 H24 M-16,-12 H-22 M-16,-9.5 H-22" stroke="${INK}" stroke-width="1"/>
    <path d="M-8,-3 Q0,4 9,-3 L7,-1 Q0,4 -6,-1Z" fill="#8e8a9e" stroke="${INK}" stroke-width="1.3"/>`;
  }
  return {g,inner,x:0,y:0,face:1};
}
function setChar(c,x,y,face,bob){ c.x=x;c.y=y;c.face=face; c.g.setAttribute('transform',`translate(${x},${y-bob}) scale(${1.25*face},1.25)`); }

/* the two friends just stand together on the lawn by Altgeld */
function placeChars(){ setChar(bunny,240,800,-1,0); setChar(cat,192,804,1,0); }

/* ---------- zoom & scrolling ---------- */
let zoom=1; const wrap=$('mapWrap');
function applyZoom(z,cx,cy){
  const prev=zoom; zoom=Math.min(3,Math.max(1,z)); const r=wrap.getBoundingClientRect();
  cx=cx??r.width/2; cy=cy??r.height/2; const sx=(wrap.scrollLeft+cx)/prev, sy=(wrap.scrollTop+cy)/prev;
  svg.style.width=(zoom*100)+'%'; wrap.scrollLeft=sx*zoom-cx; wrap.scrollTop=sy*zoom-cy;
}
$('zin').onclick=()=>applyZoom(zoom*1.35); $('zout').onclick=()=>applyZoom(zoom/1.35);
function svgToScreen(x,y){ const pt=svg.createSVGPoint(); pt.x=x; pt.y=y; const m=svg.getScreenCTM(); return pt.matrixTransform(m); }
function scrollToPt(x,y,fy=.4){ const s=svgToScreen(x,y), r=wrap.getBoundingClientRect(); glide(wrap.scrollLeft+s.x-r.width/2,wrap.scrollTop+s.y-r.height*fy); }
function glide(tx,ty){ tx=Math.max(0,Math.min(tx,wrap.scrollWidth-wrap.clientWidth)); ty=Math.max(0,Math.min(ty,wrap.scrollHeight-wrap.clientHeight)); const x0=wrap.scrollLeft,y0=wrap.scrollTop; let t0=null; const f=ts=>{ if(t0===null)t0=ts; const k=Math.min(1,(ts-t0)/450), e=1-Math.pow(1-k,3); wrap.scrollLeft=x0+(tx-x0)*e; wrap.scrollTop=y0+(ty-y0)*e; if(k<1)requestAnimationFrame(f); }; requestAnimationFrame(f); }

/* ---------- custom markers ---------- */
let placing=false;
$('markBtn').onclick=()=>{ placing=!placing; document.body.classList.toggle('placing',placing); $('markBtn').classList.toggle('on',placing); $('hint').hidden=!placing; if(placing)closeSheet(); };
svg.addEventListener('click',e=>{
  if(!placing)return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const m={id:'m'+Date.now().toString(36),x:Math.round(p.x),y:Math.round(p.y),name:'新地点',note:''};
  marks.push(m); LS.set('uiuc-marks',marks); renderMarks();
  placing=false; document.body.classList.remove('placing'); $('markBtn').classList.remove('on'); $('hint').hidden=true;
  openMark(m.id,true);
});

/* ---------- sheet ---------- */
const panel=$('panel'); let current=null; const urls=[];
function closeSheet(){ $('sheet').hidden=true; current=null; urls.splice(0).forEach(u=>URL.revokeObjectURL(u)); }
async function photoSection(placeId,label){
  const list=await photosFor(placeId);
  urls.splice(0).forEach(u=>URL.revokeObjectURL(u));
  const items=list.map(p=>{ const u=URL.createObjectURL(p.blob); urls.push(u); return `<button class="ph" data-id="${p.id}" aria-label="查看照片"><img src="${u}" alt="${label}的照片"></button>`; }).join('');
  return `<div class="photos"><h3>照片 · ${list.length} 张</h3><div class="grid">${items}
    <label class="add">＋<br>添加照片<input type="file" accept="image/*" multiple id="fileIn"></label></div>
    <p class="small" style="margin-top:8px">照片保存在这台手机的浏览器里。</p></div>`;
}
function wirePhotos(placeId,label,rerender){
  const fi=$('fileIn'); if(fi) fi.onchange=async()=>{
    const files=[...fi.files]; if(!files.length)return; const lab=fi.closest('.add'); lab.innerHTML='保存中…';
    for(const f of files){ try{ const blob=await shrink(f); await putPhoto({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),place:placeId,blob,ts:Date.now()}); }catch(e){ alert(e.message); } }
    rerender();
  };
  panel.querySelectorAll('.ph').forEach(b=>b.onclick=()=>openViewer(b.dataset.id,b.querySelector('img').src,label,rerender));
}
async function openPlace(id){
  const i=PLACES.findIndex(p=>p.id===id), p=PLACES[i]; current=id;
  const render=async()=>{
    const ps=await photoSection(p.id,p.name);
    panel.innerHTML=`<div class="grab"></div>
      <div class="sheet-head"><div class="t"><div class="eyebrow">UIUC · 地点</div><h2>${p.name}</h2><div class="en">${p.en}</div></div><button class="close" id="sClose" aria-label="关闭">✕</button></div>
      <div class="say"><svg viewBox="-26 -60 52 66" aria-hidden="true">${bunny.inner.innerHTML}</svg><div class="bub">${p.say}</div></div>
      <p class="info">${p.info}</p>
      <ul class="facts">${p.facts.map(f=>`<li>${f}</li>`).join('')}</ul>
      ${ps}`;
    $('sClose').onclick=closeSheet;
    wirePhotos(p.id,p.name,render);
  };
  $('sheet').hidden=false; await render(); panel.scrollTop=0;
}
async function openMark(id,isNew){
  const m=marks.find(x=>x.id===id); if(!m)return; current=id;
  const render=async()=>{
    const ps=await photoSection(m.id,m.name);
    panel.innerHTML=`<div class="grab"></div>
      <div class="sheet-head"><div class="t"><div class="eyebrow">我的标记</div><h2>${esc(m.name)}</h2></div><button class="close" id="sClose" aria-label="关闭">✕</button></div>
      <div class="field"><label for="mName">名字</label><input id="mName" maxlength="30" value="${esc(m.name)}" placeholder="比如：我上课的楼"></div>
      <div class="field"><label for="mNote">备注</label><textarea id="mNote" maxlength="400" placeholder="这里有什么故事？">${esc(m.note||'')}</textarea></div>
      ${ps}
      <div class="row"><button class="btn" id="mSave">保存</button><button class="btn ghost sm" id="mDel">删除这个标记</button></div>`;
    $('sClose').onclick=closeSheet;
    $('mSave').onclick=()=>{ m.name=$('mName').value.trim()||'新地点'; m.note=$('mNote').value; LS.set('uiuc-marks',marks); renderMarks(); render(); };
    let armed=false; $('mDel').onclick=async()=>{ if(!armed){armed=true; $('mDel').textContent='再点一次确认删除'; return;}
      for(const p of await photosFor(m.id))await delPhoto(p.id); marks=marks.filter(x=>x.id!==m.id); LS.set('uiuc-marks',marks); renderMarks(); closeSheet(); };
    wirePhotos(m.id,m.name,render);
    if(isNew){ isNew=false; setTimeout(()=>{ const n=$('mName'); n.focus(); n.select(); },50); }
  };
  $('sheet').hidden=false; await render(); panel.scrollTop=0;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- viewer ---------- */
let vState=null;
function openViewer(id,src,label,rerender){ vState={id,rerender}; $('vImg').src=src; $('vImg').alt=label+'的照片'; $('vCap').textContent=label; $('vDel').textContent='删除这张'; $('viewer').hidden=false; }
$('vClose').onclick=()=>{$('viewer').hidden=true;};
$('viewer').addEventListener('click',e=>{ if(e.target.id==='viewer')$('viewer').hidden=true; });
let vArm=false;
$('vDel').onclick=async()=>{ if(!vArm){vArm=true; $('vDel').textContent='再点一次确认删除'; setTimeout(()=>{vArm=false; $('vDel').textContent='删除这张';},3000); return;}
  vArm=false; await delPhoto(vState.id); $('viewer').hidden=true; vState.rerender(); };
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('viewer').hidden)$('viewer').hidden=true; else closeSheet(); } });

drawMap();
// start centred on the Main Quad
requestAnimationFrame(()=>{ const s=svgToScreen(560,560), r=wrap.getBoundingClientRect(); wrap.scrollLeft+=s.x-r.width/2; wrap.scrollTop+=s.y-r.height/2; });
})();
</script>
</body>
